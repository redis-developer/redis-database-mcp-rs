name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  redis-compatibility:
    name: Redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["6.2", "7.2", "7.4", "8.0", "8.2", "8.4", "8.6"]
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: redis-${{ matrix.redis }}
      - run: cargo test --all-features --test live_redis

  redis-stack:
    name: Redis Stack 7.4.0-v8
    runs-on: ubuntu-latest
    services:
      redis-stack:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_STACK_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: redis-stack-7.4.0-v8
      - run: cargo test --all-features --test live_redis_stack

  redis-cluster:
    name: Redis Cluster ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["6.2", "8.8"]
    env:
      REDIS_CLUSTER_URLS: redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: redis-cluster-${{ matrix.redis }}
      - name: Start Redis Cluster
        run: |
          docker run --detach --name redis-cluster \
            --publish 7000-7002:7000-7002 \
            redis:${{ matrix.redis }} \
            sh -c '
              for port in 7000 7001 7002; do
                mkdir -p /tmp/redis-$port
                redis-server \
                  --port $port \
                  --dir /tmp/redis-$port \
                  --cluster-enabled yes \
                  --cluster-config-file nodes.conf \
                  --cluster-announce-ip 127.0.0.1 \
                  --cluster-announce-port $port \
                  --appendonly no \
                  --save "" \
                  --daemonize yes
              done
              tail -f /dev/null
            '
          docker exec redis-cluster sh -c \
            'until redis-cli -p 7000 ping >/dev/null 2>&1; do sleep 0.1; done'
          docker exec redis-cluster redis-cli --cluster create \
            127.0.0.1:7000 \
            127.0.0.1:7001 \
            127.0.0.1:7002 \
            --cluster-yes
          docker exec redis-cluster redis-cli -p 7000 CLUSTER INFO
      - run: cargo test --all-features --test live_redis_cluster
