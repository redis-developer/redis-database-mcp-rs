name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --no-fail-fast
      - name: Test minimal family composition
        run: >-
          cargo test -p redis-mcp --no-default-features --features strings
          --test family_composition
      - name: Check empty feature set
        run: cargo check -p redis-mcp --no-default-features
      - name: Test default feature composition
        run: cargo test -p redis-mcp --test family_composition

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify library package
        run: cargo package -p redis-mcp
      - name: Assemble workspace packages
        run: cargo package --workspace --no-verify
      - name: Verify server package against packaged library
        shell: bash
        run: |
          server_archive="$(find target/package -maxdepth 1 -name 'redis-mcp-server-*.crate' -print -quit)"
          server_dir="${server_archive%.crate}"
          tar -xzf "$server_archive" -C target/package
          library_dir="$(find target/package -maxdepth 1 -type d -name 'redis-mcp-[0-9]*' -print -quit)"
          cargo check \
            --manifest-path "$server_dir/Cargo.toml" \
            --config "patch.crates-io.redis-mcp.path=\"$library_dir\""

  command-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start pinned Redis
        run: >-
          docker run --detach --name redis-command-ledger
          --entrypoint redis-server redis:8.10.1
          --save "" --appendonly no
      - name: Wait for Redis
        shell: bash
        run: |
          for attempt in {1..50}; do
            if docker exec redis-command-ledger redis-cli ping; then
              exit 0
            fi
            sleep 0.2
          done
          exit 1
      - name: Verify pinned command metadata
        run: >-
          python3 scripts/update_redis_commands.py
          --redis-cli-command "docker exec redis-command-ledger redis-cli"
          --check

  redis-compatibility:
    name: Redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["6.2", "7.2", "7.4", "8.0", "8.2", "8.4", "8.6", "8.10.1"]
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: redis-${{ matrix.redis }}
      - run: cargo test -p redis-mcp --all-features --test live_redis

  redis-stack:
    name: Redis Stack 7.4.0-v8
    runs-on: ubuntu-latest
    services:
      redis-stack:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_STACK_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: redis-stack-7.4.0-v8
      - run: cargo test -p redis-mcp --all-features --test live_redis_stack

  redis-cluster:
    name: Redis Cluster ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["6.2", "8.8", "8.10.1"]
    env:
      REDIS_CLUSTER_URLS: redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: redis-cluster-${{ matrix.redis }}
      - name: Start Redis Cluster
        run: |
          docker run --detach --name redis-cluster \
            --publish 7000-7002:7000-7002 \
            redis:${{ matrix.redis }} \
            sh -c '
              for port in 7000 7001 7002; do
                mkdir -p /tmp/redis-$port
                redis-server \
                  --port $port \
                  --dir /tmp/redis-$port \
                  --cluster-enabled yes \
                  --cluster-config-file nodes.conf \
                  --cluster-announce-ip 127.0.0.1 \
                  --cluster-announce-port $port \
                  --appendonly no \
                  --save "" \
                  --daemonize yes
              done
              tail -f /dev/null
            '
          docker exec redis-cluster sh -c \
            'until redis-cli -p 7000 ping >/dev/null 2>&1; do sleep 0.1; done'
          docker exec redis-cluster redis-cli --cluster create \
            127.0.0.1:7000 \
            127.0.0.1:7001 \
            127.0.0.1:7002 \
            --cluster-yes
          docker exec redis-cluster redis-cli -p 7000 CLUSTER INFO
      - run: cargo test -p redis-mcp --all-features --test live_redis_cluster
      - run: cargo test -p redis-mcp-server --all-features --test live_stdio_cluster

  slim-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: slim-build
      - name: Library compiles per feature slice
        run: |
          cargo check -p redis-mcp --no-default-features --features strings
          cargo check -p redis-mcp --no-default-features --features json,search
          cargo check -p redis-mcp --no-default-features --features sessions,transactions,admin,bulk,guidance
      - name: Slim server compiles and its config tests pass
        run: |
          cargo check -p redis-mcp-server --no-default-features \
            --features keyspace,strings,hashes,diagnostics
          cargo test -p redis-mcp-server --no-default-features \
            --features keyspace,strings,hashes,diagnostics --bin redis-mcp-server
      - name: Slim server rejects bundles it was built without
        run: |
          set -o pipefail
          if output=$(cargo run --quiet -p redis-mcp-server --no-default-features \
            --features keyspace,strings,hashes,diagnostics -- \
            --enable-bundle json --stdio 2>&1); then
            echo "expected startup to fail for an uncompiled bundle"; exit 1
          fi
          echo "$output" | grep -q "not compiled into this binary"
