name: Release-plz

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    # Forks have neither the crates.io credentials nor the environment.
    if: github.repository == 'redis-developer/redis-database-mcp-rs'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The action installs cargo-semver-checks 0.51, which needs a newer
      # toolchain than the 1.90 MSRV. CI still builds and tests on 1.90.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          # rust-toolchain.toml pins 1.90 and would otherwise override stable.
          RUSTUP_TOOLCHAIN: stable
          # Opens the release PR and pushes tags. GitHub does not run CI on a
          # PR this token opens; close and reopen the release PR to run it.
          # A RELEASE_TOKEN secret, used here and on checkout, avoids that.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # First publish only: trusted publishing can only be configured for
          # a crate that already exists on crates.io. Once redis-mcp is
          # published, add this workflow (release-plz.yml, environment
          # crates-io) as its trusted publisher, then delete this line and the
          # repository secret. The id-token permission above is already set.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
