[workspace]
members = ["crates/redis-mcp", "crates/redis-mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Josh Rotenberg <josh.rotenberg@redis.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/redis-developer/redis-database-mcp-rs"
homepage = "https://github.com/redis-developer/redis-database-mcp-rs"
readme = "README.md"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
pretty_assertions = "1.4"
rand = "0.10"
redis = { version = "1.5", default-features = false, features = ["cluster-async", "connection-manager", "tokio-rustls-comp"] }
redis-tower = { version = "0.1.4", git = "https://github.com/joshrotenberg/redis-tower", rev = "e4bfc051ab3a30e02064288b1bb6bae261cdec25", default-features = false, features = ["tls-rustls"] }
redis-tower-core = { version = "0.1.3", git = "https://github.com/joshrotenberg/redis-tower", rev = "e4bfc051ab3a30e02064288b1bb6bae261cdec25", features = ["tls-rustls"] }
redis-tower-cluster = { version = "0.1.4", git = "https://github.com/joshrotenberg/redis-tower", rev = "e4bfc051ab3a30e02064288b1bb6bae261cdec25", features = ["tls-rustls"] }
redis-mcp = { version = "0.1.0", path = "crates/redis-mcp", default-features = false }
redis-server-wrapper = "0.5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
tokio = { version = "1.40", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tower = { version = "0.5", features = ["limit"] }
tower-mcp = { version = "0.23.2", features = ["protocol-2026-07-28"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
