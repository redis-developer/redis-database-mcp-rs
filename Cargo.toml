[workspace]
members = ["crates/redis-mcp", "crates/redis-mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Josh Rotenberg <josh.rotenberg@redis.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/redis-developer/redis-database-mcp-rs"
homepage = "https://github.com/redis-developer/redis-database-mcp-rs"
readme = "README.md"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
pretty_assertions = "1.4"
rand = "0.10"
redis = { version = "1.5", default-features = false, features = ["cluster-async", "connection-manager", "tokio-rustls-comp"] }
redis-mcp = { version = "0.1.0", path = "crates/redis-mcp" }
redis-server-wrapper = "0.5.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-mcp = { version = "0.22", features = ["protocol-2026-07-28"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
