[package]
name = "redis-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Standalone MCP server for Redis databases"
keywords = ["redis", "mcp", "database", "ai", "server"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "redis-mcp-server"
path = "src/main.rs"

[features]
# The shipped binary has everything by default; constrained deployments
# select exactly the surface they want with --no-default-features plus the
# passthrough features below.
default = ["full"]
full = ["redis-mcp/full", "docs"]
# The HTTP documentation fetcher; serving docs still requires the explicit
# runtime opt-in because it introduces network egress.
docs = ["dep:reqwest", "dep:async-trait"]
all-families = ["redis-mcp/all-families"]
keyspace = ["redis-mcp/keyspace"]
strings = ["redis-mcp/strings"]
hashes = ["redis-mcp/hashes"]
lists = ["redis-mcp/lists"]
sets = ["redis-mcp/sets"]
sorted-sets = ["redis-mcp/sorted-sets"]
streams = ["redis-mcp/streams"]
bitmaps = ["redis-mcp/bitmaps"]
arrays = ["redis-mcp/arrays"]
hyperloglog = ["redis-mcp/hyperloglog"]
geospatial = ["redis-mcp/geospatial"]
vector-sets = ["redis-mcp/vector-sets"]
pubsub = ["redis-mcp/pubsub"]
scripting = ["redis-mcp/scripting"]
json = ["redis-mcp/json"]
search = ["redis-mcp/search"]
timeseries = ["redis-mcp/timeseries"]
diagnostics = ["redis-mcp/diagnostics"]
sessions = ["redis-mcp/sessions"]
transactions = ["redis-mcp/transactions"]
admin = ["redis-mcp/admin"]
bulk = ["redis-mcp/bulk"]
guidance = ["redis-mcp/guidance"]

[dependencies]
async-trait = { workspace = true, optional = true }
axum.workspace = true
clap.workspace = true
hex.workspace = true
redis-mcp.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tower-mcp = { workspace = true, features = ["http"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
redis.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tower-mcp = { workspace = true, features = ["childproc", "http-client"] }

[target.'cfg(unix)'.dev-dependencies]
redis-server-wrapper.workspace = true
tempfile.workspace = true
