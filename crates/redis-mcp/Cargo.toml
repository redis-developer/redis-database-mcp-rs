[package]
name = "redis-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/redis-mcp"
description = "Composable MCP tools for Redis databases"
keywords = ["redis", "mcp", "database", "ai", "tower"]
categories = ["database", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "redis_mcp"
path = "src/lib.rs"

[features]
default = ["full"]
full = [
    "all-families",
    "diagnostics",
    "sessions",
    "transactions",
    "admin",
    "bulk",
    "coordination",
    "guidance",
]
all-families = [
    "keyspace",
    "strings",
    "hashes",
    "lists",
    "sets",
    "sorted-sets",
    "streams",
    "bitmaps",
    "arrays",
    "hyperloglog",
    "geospatial",
    "vector-sets",
    "pubsub",
    "scripting",
    "json",
    "search",
    "timeseries",
]
keyspace = []
strings = []
hashes = []
lists = []
sets = []
sorted-sets = []
streams = []
bitmaps = []
arrays = []
hyperloglog = []
geospatial = []
vector-sets = []
pubsub = []
scripting = []
json = []
search = []
timeseries = []
diagnostics = []
sessions = []
transactions = []
admin = []
bulk = []
coordination = ["tower-mcp/stateless"]
guidance = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
rand.workspace = true
redis-tower.workspace = true
redis-tower-core.workspace = true
redis-tower-cluster.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tower-mcp.workspace = true
url.workspace = true

[dev-dependencies]
redis.workspace = true
pretty_assertions.workspace = true

[target.'cfg(unix)'.dev-dependencies]
redis-server-wrapper.workspace = true
tempfile.workspace = true
