# cargo-deny policy, checked by .github/workflows/audit.yml.
# Run locally with `cargo deny --all-features check`.

[graph]
all-features = true

[advisories]
# RustSec advisories fail the check; unmaintained crates only in our own
# dependency edges, so a transitive notice does not block unrelated work.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Every entry is used by at least one dependency;
# keep the list minimal so a new license is a deliberate decision.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are common in the async ecosystem; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry a version, so this only
# rejects bare `*` requirements on registry crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
